[project]
name = "bot"
version = "0.1.0"
description = "A bot application"
requires-python = ">=3.8"
dependencies = [
    "py-cord==2.7.1",
    "wolframalpha==5.1.3",
    "aiohttp>=3.8.0",
    "simpleeval==1.0.7",
    "pyyaml==6.0.3"
]

[project.scripts]
bot = "bot.main:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
